name: Build & Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dbot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is required for multi-arch builds with buildx
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always provide a stable v1 tag
            type=raw,value=v1
            # latest on main branch pushes / manual runs
            type=raw,value=latest,enable={{is_default_branch}}
            # Short commit SHA
            type=sha,prefix=sha-
            # Semantic versions when a release is published
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            # Branch name
            type=ref,event=branch
            # Pull request number (for PR builds)
            type=ref,event=pr

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Multi-arch: amd64 (bunny.net compatible) + arm64
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache (faster subsequent builds)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Optional: build args if needed later
          # build-args: |
          #   BUILD_VERSION=${{ steps.meta.outputs.version }}
